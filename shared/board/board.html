<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --paper:#FCFBFE; --ink:#1B1720; --soft:#6B6279; --rule:#E7E1F1;
    --accent:#7C3AED; --sheet:#FFFFFF; --dot:#C9C2D8;
  }
  html[data-theme=dark]{
    --paper:#131017; --ink:#E4DFEC; --soft:#9A91AC; --rule:#292235;
    --accent:#A78BFA; --sheet:#1D1826; --dot:#332C41;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; overflow:hidden; background:var(--paper); color:var(--ink);
            font-family:system-ui,-apple-system,"Segoe UI",sans-serif; user-select:none}

  /* холсту нужен явный размер: он замещаемый элемент, и растяжка через
     inset:0 на него не действует — остаётся стандартный 300×150 */
  canvas{display:block; position:absolute; left:0; top:0; width:100%; height:100%;
         touch-action:none; cursor:crosshair}
  body[data-tool=select] canvas{cursor:default}
  body[data-tool=hand] canvas{cursor:grab}
  body.panning canvas{cursor:grabbing}

  /* панель слева: инструменты */
  #tools{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:4px; padding:6px;
    background:var(--sheet); border:1px solid var(--rule); border-radius:14px;
    box-shadow:0 8px 26px rgba(0,0,0,.16);
  }
  #tools button{
    width:40px; height:40px; border:0; border-radius:10px; cursor:pointer;
    background:none; color:var(--ink); display:grid; place-items:center;
  }
  #tools button:hover{background:var(--rule)}
  #tools button.on{background:var(--accent); color:#fff}
  #tools button svg{width:21px; height:21px; fill:none; stroke:currentColor;
                    stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
  #tools hr{border:0; border-top:1px solid var(--rule); margin:3px 4px; width:calc(100% - 8px)}

  /* панель снизу: цвет и толщина */
  #style{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; padding:8px 12px;
    background:var(--sheet); border:1px solid var(--rule); border-radius:14px;
    box-shadow:0 8px 26px rgba(0,0,0,.16);
  }
  #colors{display:flex; gap:6px}
  #colors i{width:22px; height:22px; border-radius:50%; cursor:pointer; display:block;
            border:2px solid transparent}
  #colors i.on{border-color:var(--ink)}
  #style input[type=range]{width:110px; accent-color:var(--accent)}
  #style .sep{width:1px; height:22px; background:var(--rule)}

  /* масштаб справа снизу */
  #zoom{
    position:absolute; right:16px; bottom:16px; display:flex; align-items:center; gap:2px;
    background:var(--sheet); border:1px solid var(--rule); border-radius:12px; padding:4px;
    box-shadow:0 8px 26px rgba(0,0,0,.16);
  }
  #zoom button{width:34px; height:34px; border:0; border-radius:9px; background:none;
               color:var(--ink); cursor:pointer; font-size:17px}
  #zoom button:hover{background:var(--rule)}
  #zoom span{min-width:52px; text-align:center; font-size:12.5px; color:var(--soft)}
</style>
</head>
<body data-tool="pen">
<canvas id="c"></canvas>

<div id="tools"></div>

<div id="style">
  <div id="colors"></div>
  <div class="sep"></div>
  <input id="width" type="range" min="1" max="18" step="1" value="3">
</div>

<div id="zoom">
  <button id="out">−</button><span id="pct">100%</span><button id="in">+</button>
  <button id="fit" title="">⤢</button>
</div>

<script src="board.js"></script>
</body>
</html>
