<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --paper:#FCFBFE; --ink:#1B1720; --soft:#6B6279; --rule:#E7E1F1;
    --accent:#7C3AED; --sheet:#FFFFFF; --dot:#C9C2D8;
  }
  html[data-theme=dark]{
    --paper:#131017; --ink:#E4DFEC; --soft:#9A91AC; --rule:#292235;
    --accent:#A78BFA; --sheet:#1D1826; --dot:#332C41;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; overflow:hidden; background:var(--paper); color:var(--ink);
            font-family:system-ui,-apple-system,"Segoe UI",sans-serif; user-select:none}

  /* холсту нужен явный размер: он замещаемый элемент, и растяжка через
     inset:0 на него не действует — остаётся стандартный 300×150 */
  canvas{display:block; position:absolute; left:0; top:0; width:100%; height:100%;
         touch-action:none; cursor:crosshair}
  body[data-tool=select] canvas{cursor:default}
  body[data-tool=hand] canvas{cursor:grab}
  body.panning canvas{cursor:grabbing}

  /* ввод текста: обычное поле, поставленное поверх холста там, где ткнули */
  #typing{
    position:absolute; display:none; z-index:5; margin:0; padding:2px 4px;
    border:1.5px solid var(--accent); border-radius:6px; outline:none; resize:none;
    background:var(--paper); color:var(--ink); overflow:hidden; white-space:pre;
    font-family:"Noto Serif",Georgia,serif; line-height:1.25; min-width:60px;
  }
  #typing.on{display:block}

  /* панель слева: инструменты */
  #tools{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:4px; padding:6px;
    background:var(--sheet); border:1px solid var(--rule); border-radius:14px;
    box-shadow:0 8px 26px rgba(0,0,0,.16);
  }
  #tools button{
    width:40px; height:40px; border:0; border-radius:10px; cursor:pointer;
    background:none; color:var(--ink); display:grid; place-items:center;
  }
  #tools button:hover{background:var(--rule)}
  #tools button.on{background:var(--accent); color:#fff}
  #tools button svg{width:21px; height:21px; fill:none; stroke:currentColor;
                    stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
  #tools hr{border:0; border-top:1px solid var(--rule); margin:3px 4px; width:calc(100% - 8px)}

  /* панель снизу: цвет и толщина */
  #style{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; padding:8px 12px;
    background:var(--sheet); border:1px solid var(--rule); border-radius:14px;
    box-shadow:0 8px 26px rgba(0,0,0,.16);
  }
  #colors{display:flex; gap:6px}
  #colors i{width:22px; height:22px; border-radius:50%; cursor:pointer; display:block;
            border:2px solid transparent}
  #colors i.on{border-color:var(--ink)}
  #style input[type=range]{width:110px; accent-color:var(--accent)}
  #style .sep{width:1px; height:22px; background:var(--rule)}

  /* масштаб справа снизу */
  #zoom{
    position:absolute; right:16px; bottom:16px; display:flex; align-items:center; gap:2px;
    background:var(--sheet); border:1px solid var(--rule); border-radius:12px; padding:4px;
    box-shadow:0 8px 26px rgba(0,0,0,.16);
  }
  #zoom button{width:34px; height:34px; border:0; border-radius:9px; background:none;
               color:var(--ink); cursor:pointer; font-size:17px}
  #zoom button:hover{background:var(--rule)}
  #zoom span{min-width:52px; text-align:center; font-size:12.5px; color:var(--soft)}

  /* ——— бумажки, вырезанные из конспекта ———
     Они живут не на холсте, а слоем поверх него: содержимое настоящее —
     текст и формулы, — а такое на холсте не нарисовать. Слой едет и
     масштабируется вместе с видом, поэтому бумажка держится своего места. */
  #notes{position:absolute; left:0; top:0; width:0; height:0;
         transform-origin:0 0; pointer-events:none}
  .note{position:absolute; pointer-events:auto; border-radius:10px; padding:12px 14px 14px;
        background:var(--note-bg); border:1px solid var(--note-line);
        border-left:4px solid var(--note-edge);
        box-shadow:0 6px 18px rgba(0,0,0,.13); overflow:hidden;
        user-select:text; cursor:default}
  .note.sel{box-shadow:0 0 0 2px var(--accent), 0 6px 18px rgba(0,0,0,.13)}
  .note .body{font-size:15px; line-height:1.5; color:var(--ink)}
  .note .body h1,.note .body h2,.note .body h3{margin:.2em 0 .35em; font-size:1.08em}
  .note .body p{margin:.35em 0}
  .note .body ul{margin:.3em 0; padding-left:1.1em}
  .note .body .disp{overflow-x:auto; margin:.45em 0}
  .note .body .hide{background:var(--note-edge); border-radius:4px; color:transparent}
  .note .body .hide.open{background:none; color:inherit}
  .note .head{display:flex; align-items:center; gap:8px; margin-bottom:6px;
              font-size:11.5px; color:var(--soft)}
  .note .head .src{cursor:pointer; text-decoration:underline dotted; flex:1;
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .note .head .edited{font-style:italic; opacity:.75}
  /* Карточка-скрипт: та же бумажка, но с полями и кнопкой. */
  .note .form{margin:.2em 0 .5em; overflow-x:auto}
  .note .rows{display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center}
  .note .rows label{font-size:13px; color:var(--soft); text-align:right; white-space:nowrap}
  .note .rows input{font:inherit; font-size:14px; padding:4px 8px; border-radius:7px;
                    border:1px solid var(--note-line); background:var(--sheet);
                    color:var(--ink); width:100%; min-width:0}
  .note .rows input:focus{outline:2px solid var(--note-edge); outline-offset:-1px}
  .note .rows input.bad{border-color:#DC2626; background:rgba(220,38,38,.08)}
  .note .why{margin:.5em 0 0; font-size:13px; color:#B4231F; display:flex;
             flex-wrap:wrap; gap:4px 14px}
  html[data-theme=dark] .note .why{color:#F09090}
  .note .go{margin-top:.7em; display:flex; align-items:center; gap:8px}
  .note .go button{font:inherit; font-size:14px; padding:5px 14px; border:0;
                   border-radius:8px; background:var(--note-edge); color:#fff;
                   cursor:pointer}
  .note .go button[disabled]{opacity:.4; cursor:default}
  .note.fresh{animation:pop .28s ease-out}
  @keyframes pop{
    from{opacity:0; transform:translate(-14px,-18px) scale(.94)}
    to{opacity:1; transform:none}
  }

  .note .grip{position:absolute; right:2px; bottom:2px; width:14px; height:14px;
              cursor:nwse-resize; opacity:.45}
  .note .grip::after{content:''; position:absolute; right:3px; bottom:3px;
                     width:7px; height:7px; border-right:2px solid var(--soft);
                     border-bottom:2px solid var(--soft)}
</style>
<link rel="stylesheet" href="../reader/katex/katex.min.css">
<script defer src="../reader/katex/katex.min.js"></script>
<script defer src="../reader/reader.js"></script>
</head>
<body data-tool="pen">
<canvas id="c"></canvas>
<div id="notes"></div>

<textarea id="typing" spellcheck="false"></textarea>

<div id="tools"></div>

<div id="style">
  <div id="colors"></div>
  <div class="sep"></div>
  <input id="width" type="range" min="1" max="18" step="1" value="3">
</div>

<div id="zoom">
  <button id="out">−</button><span id="pct">100%</span><button id="in">+</button>
  <button id="fit" title="">⤢</button>
</div>

<script src="board.js"></script>
</body>
</html>
