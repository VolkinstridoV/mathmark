<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root{
    --paper:#FCFBFE; --ink:#1B1720; --soft:#6B6279; --rule:#E7E1F1;
    --accent:#7C3AED; --accent2:#A855F7; --code:#F3EFFA; --quote:#F1ECFA;
  }
  html[data-theme=dark]{
    --paper:#131017; --ink:#E4DFEC; --soft:#9A91AC; --rule:#292235;
    --accent:#7C3AED; --accent2:#9333EA; --code:#1E1828; --quote:#241E30;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--paper); color:var(--ink)}
  body{
    font-family:"Noto Serif",Georgia,serif;
    font-size:calc(16px * var(--sc,1));
    line-height:1.66;
    /* на телефоне экран уже этой ширины, на мониторе строка не должна
       растягиваться через весь экран — глаз теряет начало следующей */
    max-width:44rem;
    margin:0 auto;
    padding:18px 18px calc(64px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:none;
  }
  h1{font-size:1.5em; font-weight:700; line-height:1.25; margin:0 0 .35em}
  h2{font-size:1.18em; font-weight:700; margin:1.7em 0 .5em; padding-bottom:.26em;
     border-bottom:1px solid var(--rule); color:var(--accent); scroll-margin-top:10px}
  h3{font-size:1.05em; font-weight:700; margin:1.5em 0 .35em; scroll-margin-top:10px}
  p{margin:0 0 .95em}
  hr{border:0; border-top:1px solid var(--rule); margin:1.8em 0}
  blockquote{margin:1.2em 0; padding:.5em .9em; border-left:3px solid var(--accent);
             background:var(--quote); border-radius:0 8px 8px 0; color:var(--soft)}
  blockquote p:last-child{margin:0}
  code{font-family:"DejaVu Sans Mono",monospace; font-size:.86em; background:var(--code);
       padding:.12em .35em; border-radius:4px}
  pre{background:var(--code); padding:11px 13px; border-radius:9px; overflow-x:auto; margin:1.1em 0}
  pre code{background:none; padding:0}
  .tw{overflow-x:auto; margin:1.2em 0}
  table{border-collapse:collapse; width:100%; font-size:.95em}
  th,td{border-bottom:1px solid var(--rule); padding:.48em .55em; text-align:left}
  th{color:var(--accent); font-size:.94em; font-weight:700}
  ul.plain{margin:0 0 1em; padding-left:1.25em}
  ul.plain li{margin:.2em 0}

  /* отмечаемые строки */
  ul.marks{list-style:none; margin:0 0 1.1em; padding:0}
  ul.marks li{display:flex; gap:.7em; align-items:flex-start; padding:.3em 0}
  .box{flex:0 0 auto; width:23px; height:23px; margin-top:.15em; position:relative;
       border:1.8px solid var(--soft); display:grid; place-items:center; cursor:pointer;
       background:var(--paper); transition:background .12s,border-color .12s}
  .box.task{border-radius:7px}
  .box:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .box.topic{border-radius:50%}
  .box svg{width:13px; height:13px; stroke:#fff; stroke-width:2.6; fill:none;
           stroke-linecap:round; stroke-linejoin:round; opacity:0}
  li[data-mark=half] .box{
    border-color:var(--accent);
    background:linear-gradient(90deg,var(--accent) 50%,transparent 50%);
  }
  li[data-mark=done] .box{
    border-color:transparent;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  li[data-mark=done] .box svg{opacity:1}
  li[data-mark=done] .txt{color:var(--soft)}
  /* сделанная задача перечёркивается, пройденная тема — нет, она просто гаснет */
  li[data-kind=task][data-mark=done] .txt{text-decoration:line-through; text-decoration-thickness:1px}
  .txt{flex:1; min-width:0}

  /* формулы */
  .katex{font-size:1.04em}
  .katex .text,.katex .mord.text{font-family:KaTeX_Main,"Noto Serif",serif}
  .disp{margin:1.2em 0; overflow-x:auto; overflow-y:hidden; padding:.2em 0}
  .disp .katex-display{margin:0}
  .bad{color:#D9453D; border-bottom:1px dotted #D9453D}
  svg.plot{display:block; margin:1.2em auto; max-width:100%; height:auto; color:var(--soft)}

  /* скрытый текст: плашка ровно того же размера, что и содержимое —
     иначе при открытии страница дёргается, а по ширине видно длину ответа */
  .hide{
    background:var(--soft); border-radius:5px; cursor:pointer;
    transition:background .15s; -webkit-user-select:none; user-select:none;
  }
  .hide > *{opacity:0; transition:opacity .15s}
  .hide{color:transparent}
  .hide.open{background:none; color:inherit; cursor:text; user-select:text}
  .hide.open > *{opacity:1}
  .hide:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .empty{padding:56px 20px; text-align:center; color:var(--soft)}

  /* ——————————— правка: голый текст, как в редакторе кода ——————————— */
  :root{
    --ed-head:#7C3AED; --ed-mark:#2F855A; --ed-math:#B7791F;
    --ed-hide:#805AD5; --ed-draw:#2B6CB0; --ed-soft:#718096; --ed-bad:#D9453D;
  }
  html[data-theme=dark]{
    --ed-head:#B794F4; --ed-mark:#68D391; --ed-math:#F6C177;
    --ed-hide:#C4A7F5; --ed-draw:#7FB4E8; --ed-soft:#8A93A5; --ed-bad:#FF6B6B;
  }

  #edit{display:none; position:fixed; inset:0; background:var(--paper); flex-direction:column; z-index:50}
  html[data-mode=edit] #edit{display:flex}
  html[data-mode=edit], html[data-mode=edit] body{overflow:hidden; height:100%}
  html[data-mode=edit] #doc{display:none}

  #tools{display:flex; gap:6px; overflow-x:auto; padding:8px 8px 6px;
         border-bottom:1px solid var(--rule); background:var(--paper)}
  #tools button{flex:0 0 auto; font-family:system-ui,sans-serif; font-size:13px;
    padding:7px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;
    color:var(--accent); background:none; border:1px solid var(--rule)}
  #tools button:active{background:var(--quote)}

  #pane{flex:1; display:flex; min-height:0; overflow:hidden}
  #hl, #raw{font-family:"DejaVu Sans Mono",monospace; font-size:13.5px; line-height:1.6}

  #wrap{position:relative; flex:1; overflow:hidden}
  #hl, #raw{position:absolute; inset:0; margin:0; padding:10px 12px; border:0;
    white-space:pre-wrap; overflow-wrap:break-word; overflow:auto; tab-size:2}
  #hl{pointer-events:none; color:var(--ink)}
  #raw{background:transparent; color:transparent; caret-color:var(--accent); resize:none; outline:none}

  .t-head{color:var(--ed-head); font-weight:700}
  .t-mark{color:var(--ed-mark); font-weight:700}
  .t-math{color:var(--ed-math)}
  .t-hide{color:var(--ed-hide); text-decoration:underline; text-decoration-style:dotted}
  .t-draw{color:var(--ed-draw)}
  .t-soft{color:var(--ed-soft)}
  .t-bad{color:var(--ed-bad); text-decoration:underline wavy var(--ed-bad)}

  #status{display:flex; align-items:center; gap:10px; padding:8px 10px;
    border-top:1px solid var(--rule); font-family:system-ui,sans-serif; font-size:12.5px;
    color:var(--soft); background:var(--paper)}
  #status.bad #verdict{color:var(--ed-bad); cursor:pointer; text-decoration:underline}
  #status .grow{flex:1}
  #status button{font-family:system-ui,sans-serif; font-size:13px; padding:8px 15px;
    border-radius:8px; cursor:pointer; border:1px solid var(--rule); background:none; color:var(--ink)}
  #status button.main{background:var(--accent); color:#fff; border-color:transparent}

  /* меню по слэшу */
  /* подсказки по слэшу: полоска сверху поля — клавиатура её не закрывает */
  #slash{position:absolute; left:0; right:0; top:0; z-index:60; display:none;
    gap:6px; padding:6px; overflow-x:auto; white-space:nowrap;
    background:var(--sheet, var(--paper)); border-bottom:1px solid var(--rule);
    box-shadow:0 6px 18px rgba(0,0,0,.22)}
  #slash.on{display:flex}
  #slash div{flex:0 0 auto; padding:7px 11px; border-radius:8px; cursor:pointer;
    font-family:system-ui,sans-serif; font-size:13.5px; color:var(--ink);
    border:1px solid var(--rule)}
  #slash div.sel{background:var(--accent); color:#fff; border-color:transparent}
  #slash div b{font-family:"DejaVu Sans Mono",monospace; opacity:.7; font-weight:400}
</style>
</head>
<body>
<div id="doc"></div>

<div id="edit">
  <div id="tools"></div>
  <div id="pane">
    <div id="wrap">
      <pre id="hl"><code></code></pre>
      <textarea id="raw" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      <div id="slash"></div>
    </div>
  </div>
  <div id="status">
    <span id="verdict"></span><span class="grow"></span>
    <button id="cancel"></button><button id="save" class="main"></button>
  </div>
</div>
<script src="katex/katex.min.js"></script>
<script src="reader.js"></script>
<script src="editor.js"></script>
</body>
</html>
