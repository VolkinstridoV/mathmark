<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img"
     aria-label="MathMark">
  <!--
    Значок в подаче «Слои»: скруглённый квадрат с градиентом, свет сверху,
    знак корня приподнят над подложкой собственной тенью.

    Размеры width/height нарочно не заданы: с ними часть загрузчиков считает
    128 пикселей «родным» размером и растягивает растр вверх — на крупном
    экране получалось мыло, хотя рисунок векторный.
  -->
  <defs>
    <linearGradient id="body" x1="10" y1="4" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9457FF"/>
      <stop offset="1" stop-color="#5B18DC"/>
    </linearGradient>
    <!-- блик: свет падает сверху, как на любую вещь, лежащую на столе -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".40"/>
      <stop offset=".52" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3.2" stdDeviation="2.8"
                    flood-color="#2A0968" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="100" height="100" rx="27" fill="url(#body)"/>
  <rect x="4" y="4" width="100" height="100" rx="27" fill="url(#sheen)"/>

  <!-- корень из икс, приподнятый над подложкой -->
  <g filter="url(#lift)" fill="none" stroke="#ffffff" stroke-width="5.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 58 L33 58 L42 76 L56 32 L84 32"/>
    <path d="M62 45 L74 63" stroke-width="4.8"/>
    <path d="M74 45 L62 63" stroke-width="4.8"/>
  </g>

  <!-- тонкая светлая грань по краю: она и даёт ощущение вещи, а не пятна -->
  <rect x="5.3" y="5.3" width="97.4" height="97.4" rx="25.9" fill="none"
        stroke="#ffffff" stroke-opacity=".45" stroke-width="1.3"/>
</svg>
