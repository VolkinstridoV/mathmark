# Сборка пакета Flatpak — им можно поделиться с людьми на любой системе.
#
#   flatpak install flathub org.gnome.Platform//49 org.gnome.Sdk//49
#   flatpak-builder --force-clean --user --install build desktop/dev.yury.koren.yml
#   flatpak run dev.yury.koren
#
# Файл собирает и общую папку shared/ — ту же самую, что лежит внутри
# приложения для телефона.

app-id: dev.yury.koren
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: koren

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # доступ к документам пользователя: там лежат файлы с математикой
  - --filesystem=home
  # печать
  - --socket=cups

modules:
  - name: koren
    buildsystem: simple
    build-commands:
      - install -Dm755 desktop/koren-launcher /app/bin/koren
      - cp -r desktop/koren /app/lib/koren
      - mkdir -p /app/share/koren
      - cp -r shared/reader shared/prompt /app/share/koren/
      - install -Dm644 desktop/dev.yury.koren.desktop /app/share/applications/dev.yury.koren.desktop
      - install -Dm644 desktop/data/dev.yury.koren.svg /app/share/icons/hicolor/scalable/apps/dev.yury.koren.svg
      - install -Dm644 desktop/data/dev.yury.koren.metainfo.xml /app/share/metainfo/dev.yury.koren.metainfo.xml
    sources:
      - type: dir
        path: ..
