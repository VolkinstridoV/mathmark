# Сборка пакета Flatpak.
#
# Себе:
#   flatpak run org.flatpak.Builder --force-clean --user --repo=repo build \
#       desktop/io.github.volkinstridov.MathMark.yml
#
# Тот же файл подаётся на Flathub, поэтому исходники берутся не из папки
# рядом, а архивом с GitHub по метке — иначе их серверы не смогут собрать.

app-id: io.github.volkinstridov.MathMark
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: mathmark

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # только «Документы»: там лежит папка по умолчанию ~/Documents/math.
  # Доступ ко всей домашней папке Flathub пропускает лишь по особому
  # разрешению, а ради читалки просить его незачем.
  - --filesystem=xdg-documents
  # печать шпоры
  - --socket=cups

modules:
  # SymPy в рантайме GNOME нет, а карточкам-скриптам без него нечем считать.
  # Кладём колёсами: сборщики Flathub в сеть не ходят, поэтому оба файла
  # объявлены с отпечатками.
  - name: python-sympy
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --prefix=/app mpmath-*.whl sympy-*.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/13/f2/abeec3db71d221ccd3cd89d206be1fabf5a3ee7178862f5fba23a59607e0/mpmath-1.4.1-py3-none-any.whl
        sha256: dc4f0ea2304480d4a9a48a94c1020571558ade522b44a6912efac63a586e140f
      - type: file
        url: https://files.pythonhosted.org/packages/a2/09/77d55d46fd61b4a135c444fc97158ef34a095e5681d0a6c10b75bf356191/sympy-1.14.0-py3-none-any.whl
        sha256: e091cc3e99d2141a0ba2847328f5479b05d94a6635cb96148ccb3f34671bd8f5

  - name: mathmark
    buildsystem: simple
    build-commands:
      - install -Dm755 desktop/mathmark-launcher /app/bin/mathmark
      - mkdir -p /app/lib/mathmark /app/share/mathmark
      - cp -r desktop/mathmark/. /app/lib/mathmark/
      - cp -r shared/reader shared/board shared/write shared/cards shared/prompt shared/i18n shared/whatsnew shared/meta /app/share/mathmark/
      - install -Dm644 desktop/io.github.volkinstridov.MathMark.desktop
        /app/share/applications/io.github.volkinstridov.MathMark.desktop
      - install -Dm644 desktop/data/io.github.volkinstridov.MathMark.svg
        /app/share/icons/hicolor/scalable/apps/io.github.volkinstridov.MathMark.svg
      - install -Dm644 desktop/data/io.github.volkinstridov.MathMark.metainfo.xml
        /app/share/metainfo/io.github.volkinstridov.MathMark.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/VolkinstridoV/mathmark/archive/refs/tags/v1.3.tar.gz
        sha256: 470a076b57a9ce4003fafbe650eadbd169f1d1041285bafafcd855610f1bf0bc
